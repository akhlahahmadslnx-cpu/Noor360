name: Build Noor360 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create Project Files
        run: |
          cat > pubspec.yaml << 'EOF'
          name: noor360
          description: Noor360 Islamic App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.5
          flutter:
            uses-material-design: true
          EOF
          flutter create . --platforms=android --org com.noor360 --project-name noor360 --overwrite || true
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor360-APK
          path: build/app/outputs/flutter-apk/app-release.apk
